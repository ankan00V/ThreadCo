name: Warm the Render backend (manual)

# NOT on a schedule, deliberately.
#
# Render's free tier gives 750 instance-hours per month against a ~730-hour
# month. Pinging continuously to prevent the ~15-minute idle sleep therefore
# consumes essentially the entire monthly allowance, and once it runs out the
# service stops answering altogether — a worse failure than a slow first load.
#
# So the cold start is handled in the product instead: the frontend fires
# /healthz as its bundle loads (see warmBackend() in src/api.js) and shows a
# progress screen while the instance wakes.
#
# Run this by hand from the Actions tab a few minutes before sharing the link
# with someone, so their first visit lands on an already-warm instance. It pings
# for 30 minutes and then stops.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep pinging (minutes)"
        required: false
        default: "30"

permissions: {}

concurrency:
  group: warm-render
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      HEALTH_URL: https://threadco-api.onrender.com/healthz
      MINUTES: ${{ inputs.minutes || '30' }}
    steps:
      - name: Ping until the window closes
        run: |
          set -uo pipefail
          deadline=$(( SECONDS + MINUTES * 60 ))
          attempts=0; failures=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempts=$(( attempts + 1 ))
            # A cold instance can take ~50s to answer its first request.
            if curl --fail --silent --show-error --location \
                 --connect-timeout 20 --max-time 120 \
                 --retry 3 --retry-delay 10 --retry-all-errors \
                 "$HEALTH_URL" > /dev/null; then
              echo "$(date -u +%H:%M:%S) ping $attempts ok"
            else
              failures=$(( failures + 1 ))
              echo "$(date -u +%H:%M:%S) ping $attempts FAILED"
            fi
            [ "$SECONDS" -ge "$deadline" ] && break
            sleep 300
          done

          echo "--- attempts=$attempts failures=$failures"
          if [ "$attempts" -gt 0 ] && [ "$failures" -eq "$attempts" ]; then
            echo "::error::Every ping failed; the backend appears to be down."
            exit 1
          fi
