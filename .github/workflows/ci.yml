name: CI

# Runs on the Python version Render runs (3.11), because that is the whole point:
# an f-string that only parses on 3.12 broke the deploy twice before this existed,
# and ast.parse(feature_version=(3,11)) does not catch it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xeno-crm-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: xeno-crm-backend/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile every module under 3.11
        run: ./check_python311.sh

      - name: Import the app
        # Catches import-time failures that syntax checking cannot, which is the
        # class of error that actually took the deploy down.
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: python -c "import app.main; print('app imports cleanly')"

      - name: Tests
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xeno-crm-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: xeno-crm-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the working tree for credential patterns
        run: |
          # Narrow, high-signal patterns rather than a generic entropy scan:
          # a Neon password, an NVIDIA key, an ElevenLabs key. Committed
          # credentials are the failure this repo has actually had.
          if git grep -nEI 'npg_[A-Za-z0-9]{10,}|nvapi-[A-Za-z0-9_-]{20,}|sk_[a-f0-9]{40,}' \
               -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::A credential pattern is present in the working tree."
            exit 1
          fi
          echo "No credential patterns in the working tree."
